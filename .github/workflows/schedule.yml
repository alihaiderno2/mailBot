name: Daily Email Bot

on:
  schedule:
    # Runs at 14:00 UTC every day. 
    # Use crontab.guru to calculate your specific desired time.
    - cron: '0 14 * * *' 
  workflow_dispatch: # Allows you to trigger it manually for testing

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Run the bot
        env: # Injects your hidden secrets into the Python os.environ
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
        run: python bot.py
