name: Daily Email Bot

on:
  schedule:
    - cron: '0 14 * * *' 
  workflow_dispatch:

permissions:
  contents: write # Crucial: Allows the bot to save the CSV back to your repo

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Run the bot
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
        run: python bot.py
        
      - name: Commit updated CSV
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add contacts.csv
          # The '|| exit 0' prevents the action from failing if no emails were sent (no changes)
          git commit -m "Automated update: Marked batch as sent in CSV" || exit 0
          git push
