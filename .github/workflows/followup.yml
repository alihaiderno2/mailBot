name: Daily Follow-Up Bot

on:
  schedule:
    - cron: '0 16 * * *' # Runs 2 hours after the main bot to prevent git push conflicts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-followup-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Run the follow-up bot
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
        run: python followup_bot.py
        
      - name: Commit updated CSV
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add "Pakistan Restaurants Leads - Verified Emails.csv"
          git commit -m "Automated update: Marked follow-up batch as sent" || exit 0
          git push
